<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Controle Financeiro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <h2>Controle Financeiro</h2>
    <button id="logout">Sair</button>
  </nav>

  <div class="container">
    <aside class="menu">
      <ul>
        <li class="active" data-section="home">Visão Geral</li>
        <li data-section="entradas">Entradas</li>
        <li data-section="saidas">Saídas</li>
        <li data-section="investimentos">Investimentos</li>
        <li data-section="backup">Backup</li>
      </ul>
    </aside>

    <main class="content">
      <section id="home" class="section active">
        <h3>Resumo Financeiro</h3>
        <canvas id="financeChart"></canvas>
      </section>

      <section id="entradas" class="section">
        <h3>Entradas</h3>
        <div class="form-group">
          <input type="text" id="entradaDesc" placeholder="Descrição">
          <input type="number" id="entradaValor" placeholder="Valor">
          <button id="addEntrada">Adicionar</button>
        </div>
        <ul id="listaEntradas"></ul>
      </section>

      <section id="saidas" class="section">
        <h3>Saídas</h3>
        <div class="form-group">
          <input type="text" id="saidaDesc" placeholder="Descrição">
          <input type="number" id="saidaValor" placeholder="Valor">
          <button id="addSaida">Adicionar</button>
        </div>
        <ul id="listaSaidas"></ul>
      </section>

      <section id="investimentos" class="section">
        <h3>Investimentos</h3>
        <div class="form-group">
          <input type="text" id="invDesc" placeholder="Descrição">
          <input type="number" id="invValor" placeholder="Valor">
          <button id="addInvestimento">Adicionar</button>
        </div>
        <ul id="listaInvestimentos"></ul>
      </section>

      <section id="backup" class="section">
        <h3>Backup</h3>
        <button id="exportBackup">Exportar Backup</button>
        <input type="file" id="importBackup" accept=".json" />
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" src="firebase.js"></script>
  <script type="module" src="auth.js"></script>
  <script src="chart.js"></script>
  <script src="script.js"></script>
</body>
</html>
