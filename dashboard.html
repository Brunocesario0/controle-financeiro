<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Dinheiro Organizado</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <h2>Olá, <span id="user-name"></span>!</h2>

    <h3>Lançar Transação</h3>
    <select id="type">
      <option value="receita">Receita</option>
      <option value="despesa">Despesa</option>
      <option value="investimento">Investimento</option>
      <option value="saque">Saque</option>
    </select>
    <input type="number" id="value" placeholder="Valor" />
    <input type="text" id="category" placeholder="Categoria" />
    <input type="date" id="date" />
    <button onclick="addTransaction()">Adicionar</button>

    <h3>Histórico</h3>
    <table>
      <thead>
        <tr>
          <th>Usuário</th>
          <th>Tipo</th>
          <th>Valor</th>
          <th>Categoria</th>
          <th>Data</th>
        </tr>
      </thead>
      <tbody id="history-body"></tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
