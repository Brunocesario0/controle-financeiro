<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Controle Financeiro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <h2>Controle Financeiro</h2>
    <button id="logout">Sair</button>
  </nav>

  <div class="container">
    <aside class="menu">
      <ul>
        <li data-section="receitas">Receitas</li>
        <li data-section="despesas">Despesas</li>
        <li data-section="investimentos">Investimentos</li>
        <li data-section="saques">Saques</li>
      </ul>
    </aside>

    <main class="content">
      <section id="receitas" class="section active">
        <h3>Receitas</h3>
        <div class="form-group">
          <input type="text" id="descReceita" placeholder="Descrição">
          <input type="number" id="valorReceita" placeholder="Valor">
          <button id="addReceita">Adicionar</button>
        </div>
        <ul id="listaReceitas"></ul>
      </section>

      <section id="despesas" class="section">
        <h3>Despesas</h3>
        <div class="form-group">
          <input type="text" id="descDespesa" placeholder="Descrição">
          <input type="number" id="valorDespesa" placeholder="Valor">
          <button id="addDespesa">Adicionar</button>
        </div>
        <ul id="listaDespesas"></ul>
      </section>

      <section id="investimentos" class="section">
        <h3>Investimentos</h3>
        <div class="form-group">
          <input type="text" id="descInvest" placeholder="Descrição">
          <input type="number" id="valorInvest" placeholder="Valor">
          <button id="addInvest">Adicionar</button>
        </div>
        <ul id="listaInvestimentos"></ul>
      </section>

      <section id="saques" class="section">
        <h3>Saques</h3>
        <div class="form-group">
          <input type="text" id="descSaque" placeholder="Descrição">
          <input type="number" id="valorSaque" placeholder="Valor">
          <button id="addSaque">Adicionar</button>
        </div>
        <ul id="listaSaques"></ul>
      </section>
    </main>
  </div>

  <canvas id="financeChart"></canvas>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="auth.js"></script>
  <script src="chart.js"></script>
  <script src="script.js"></script>
</body>
</html>
