<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Controle Financeiro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>💼 Painel Financeiro</h1>
    <button id="logout">Sair</button>
  </header>

  <main>
    <section>
      <h2>Lançamentos</h2>
      <form id="form-lancamento">
        <select id="pessoa" required>
          <option value="">-- Quem --</option>
          <option value="Bruno">Bruno</option>
          <option value="Giovana">Giovana</option>
        </select>
        <select id="tipo" required>
          <option value="">-- Tipo --</option>
          <option value="Receita">Receita</option>
          <option value="Despesa">Despesa</option>
          <option value="Investimento">Investimento</option>
          <option value="Saque">Saque</option>
        </select>
        <input type="text" id="descricao" placeholder="Descrição" required />
        <input type="number" id="valor" step="0.01" placeholder="Valor" required />
        <input type="date" id="dataRef" />
        <button type="submit">Salvar</button>
      </form>

      <table id="tabela-lancamentos">
        <thead>
          <tr>
            <th>Quem</th>
            <th>Descrição</th>
            <th>Valor</th>
            <th>Tipo</th>
            <th>Data (ref.)</th>
            <th>Registro</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
