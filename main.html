<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Financeiro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>💸 Controle Financeiro do Casal</h1>
    <div>
      <span id="usuario-logado"></span>
      <button onclick="logout()">Sair</button>
    </div>
  </header>

  <section id="secao-usuarios" style="display:none;">
    <h2>Gerenciamento de Usuários</h2>
    <form id="form-novo-usuario">
      <input type="email" id="novo-email" placeholder="Novo e-mail" required />
      <input type="password" id="nova-senha" placeholder="Senha" required />
      <select id="novo-tipo">
        <option value="admin">Administrador</option>
        <option value="usuario">Usuário</option>
      </select>
      <button type="submit">Adicionar Usuário</button>
    </form>
    <table id="tabela-usuarios">
      <thead><tr><th>E-mail</th><th>Tipo</th><th>Ações</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <hr />

  <main id="app-container"></main>

  <script src="script.js"></script>
</body>
</html>
