<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciamento de Usuários</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Gerenciamento de Usuários</h1>
    <nav>
      <a href="inserir.html">Inserção</a>
      <a href="graficos.html">Gráficos</a>
      <a href="backup.html">Backup</a>
      <button id="logout" class="btn danger">Sair</button>
    </nav>
  </header>

  <main class="container">
    <div id="admin-only">
      <h2>Usuários</h2>
      <p>Apenas o master pode gerenciar usuários.</p>
      <form id="user-form">
        <input type="email" id="novo-email" placeholder="Novo e-mail" required>
        <input type="password" id="nova-senha" placeholder="Senha" required>
        <select id="tipo">
          <option value="usuario">Usuário</option>
          <option value="admin">Administrador</option>
        </select>
        <button type="submit" class="btn primary">Criar Usuário</button>
      </form>
      <div id="lista-usuarios"></div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
