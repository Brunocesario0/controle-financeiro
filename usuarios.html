<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciar Usuários</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>👥 Usuários</h1>
    <nav>
      <ul>
        <li><a href="index.html">Voltar</a></li>
        <li><button id="logout" class="btn danger">Sair</button></li>
      </ul>
    </nav>
  </header>
  <main class="container">
    <section class="card">
      <h2>Lista de Usuários</h2>
      <table id="tabelaUsuarios">
        <thead><tr><th>Email</th><th>Tipo</th><th>Último Login</th><th>Ações</th></tr></thead>
        <tbody></tbody>
      </table>

      <h3>Cadastrar Novo Usuário</h3>
      <form id="formNovoUsuario">
        <label>Email <input type="email" id="novoEmail" required></label>
        <label>Senha <input type="password" id="novaSenha" required></label>
        <label>Tipo
          <select id="novoTipo">
            <option value="admin">Administrador</option>
            <option value="usuario">Usuário</option>
          </select>
        </label>
        <button class="btn primary" type="submit">Adicionar</button>
      </form>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
