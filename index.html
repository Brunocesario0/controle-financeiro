<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle Financeiro em Casal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>💰 Controle Financeiro em Casal</h1>
    <p>Gerencie gastos, contas e investimentos de forma simples.</p>
  </header>

  <main>
    <section id="form-section">
      <h2>Adicionar Lançamento</h2>
      <form id="finance-form">
        <select id="pessoa" required>
          <option value="">Quem?</option>
          <option value="Bruno">Bruno</option>
          <option value="Giovana">Giovana</option>
        </select>
        <input type="text" id="descricao" placeholder="Descrição" required>
        <input type="number" id="valor" placeholder="Valor (R$)" required step="0.01">
        <select id="tipo" required>
          <option value="">Tipo</option>
          <option value="Despesa">Despesa</option>
          <option value="Investimento">Investimento</option>
          <option value="Receita">Receita</option>
        </select>
        <button type="submit">Adicionar</button>
      </form>
    </section>

    <section id="tabela-section">
      <h2>💼 Lançamentos</h2>
      <table id="tabela">
        <thead>
          <tr>
            <th>Pessoa</th>
            <th>Descrição</th>
            <th>Valor (R$)</th>
            <th>Tipo</th>
            <th>Data</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <button id="exportar">📊 Exportar para Excel</button>
    </section>

    <section id="resumo-section">
      <h2>Resumo</h2>
      <div id="resumo">
        <p>Bruno: <span id="saldo-bruno">R$ 0,00</span></p>
        <p>Giovana: <span id="saldo-giovana">R$ 0,00</span></p>
        <p><strong>Casal:</strong> <span id="saldo-total">R$ 0,00</span></p>
      </div>
    </section>
  </main>

  <footer>
    <p>Desenvolvido por Bruno Cesário 💻</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
