<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finance App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Tela de Login -->
    <div id="login-screen" class="screen">
      <h2>Login</h2>
      <input type="text" id="login-username" placeholder="Email" />
      <input type="password" id="login-password" placeholder="Senha" />
      <button onclick="login()">Entrar</button>
      <button onclick="showRegister()">Registrar</button>
    </div>

    <!-- Tela de Registro -->
    <div id="register-screen" class="screen hidden">
      <h2>Registrar</h2>
      <input type="text" id="register-username" placeholder="Email" />
      <input type="password" id="register-password" placeholder="Senha" />
      <label><input type="checkbox" id="register-master" /> Usuário master</label>
      <button onclick="register()">Salvar</button>
      <button onclick="showLogin()">Voltar</button>
    </div>

    <!-- Tela de Inserção de Dados -->
    <div id="data-screen" class="screen hidden">
      <h2>Inserir Dados Financeiros</h2>
      <select id="type">
        <option value="receita">Receita</option>
        <option value="despesa">Despesa</option>
      </select>
      <input type="number" id="value" placeholder="Valor" />
      <input type="text" id="category" placeholder="Categoria" />
      <input type="date" id="date" />
      <button onclick="addTransaction()">Adicionar</button>
      <button onclick="showChart()">Ver Gráficos</button>
      <button onclick="showUserManagement()">Gerenciar Usuários</button>
      <button onclick="showBackupScreen()">Backup e Restauração</button>
    </div>

    <!-- Tela de Gráficos -->
    <div id="chart-screen" class="screen hidden">
      <h2>Gráficos</h2>
      <canvas id="financeChart"></canvas>
      <button onclick="showDataScreen()">Voltar</button>
    </div>
    
    <!-- Tela de Backup e Restauração -->
<div id="backup-screen" class="screen hidden">
  <h2>Backup e Restauração</h2>

  <button onclick="exportBackup()">Exportar Backup (JSON)</button>
  <button onclick="exportToExcel()">Exportar para Excel</button>

  <h3>Restaurar Backup</h3>
  <textarea id="restore-input" rows="6" placeholder="Cole aqui o JSON de backup"></textarea>
  <button onclick="restoreBackup()">Restaurar</button>

  <button onclick="showDataScreen()">Voltar</button>
</div>

    <!-- Tela de Gerenciamento de Usuários -->
    <div id="user-screen" class="screen hidden">
      <h2>Gerenciar Usuários</h2>
      <h3>Criar novo usuário</h3>
      <input type="text" id="new-user-email" placeholder="Email" />
      <input type="password" id="new-user-password" placeholder="Senha" />
      <label><input type="checkbox" id="new-user-master" /> Usuário master</label>
      <button onclick="createUserFromMaster()">Criar</button>
      <hr />
      <h3>Usuários cadastrados</h3>
      <ul id="user-list"></ul>
      <button onclick="showDataScreen()">Voltar</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>
</body>
</html>
