<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciamento de Usuários</title>
  <link rel="stylesheet" href="style.css">
  <script>
    const loggedUser = JSON.parse(localStorage.getItem("loggedUser"));
    if (!loggedUser || loggedUser.role !== "master") {
      window.location.href = "login.html";
    }
  </script>
</head>
<body>
  <header>
    <h1>👥 Gerenciar Usuários</h1>
    <p>Somente o usuário master pode acessar esta página.</p>
    <div style="text-align:center; margin-top:10px;">
      <button id="voltar" class="btn small">⬅ Voltar ao Sistema</button>
      <button id="logout" class="btn danger small">Sair</button>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>Criar Novo Usuário</h2>
      <form id="user-form">
        <label>E-mail
          <input type="email" id="new-email" required />
        </label>
        <label>Senha
          <input type="password" id="new-password" required />
        </label>
        <label>Função
          <select id="new-role" required>
            <option value="">--Selecione--</option>
            <option value="admin">Administrador</option>
            <option value="user">Usuário</option>
          </select>
        </label>
        <button type="submit" class="btn primary">Adicionar Usuário</button>
      </form>
    </section>

    <section class="card">
      <h2>Usuários Existentes</h2>
      <table id="user-table">
        <thead>
          <tr><th>E-mail</th><th>Função</th><th>Ações</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="users.js"></script>
</body>
</html>
